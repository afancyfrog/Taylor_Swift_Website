
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Motif | Taylor Swift Thematic Music Archive</title>

    <!-- Your existing global stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Motif detail page stylesheet -->
    <link rel="stylesheet" href="css/motif-detail.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="index.html" class="nav-title">
            Taylor Swift Thematic Music Archive
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="discover.html">Motifs</a>
        </div>
    </nav>


    <main class="motif-page">

        <!-- HERO -->
        <section class="motif-hero">

            <img id="motif-hero-image" src="" alt="">

            <div class="motif-hero-content">
                <h1 id="motif-title"></h1>

                <p id="motif-description"></p>
            </div>

        </section>


        <!-- PHYSICAL RELEASES -->
        <section class="motif-section physical-section">

            <h2 class="section-heading">
                <span>Related</span>
                <span>Physical Release</span>
            </h2>

            <div id="physical-releases" class="physical-releases">
            </div>

        </section>


        <!-- SONG TITLES -->
        <section class="motif-section songs-section">

            <h2 class="section-heading">
                <span>Related</span>
                <span>Song Titles</span>
            </h2>

            <div id="song-titles" class="song-titles">
            </div>

        </section>


        <!-- LYRICS -->
        <section class="motif-section lyrics-section">

            <div class="lyrics-image">
                <img
                    src="images/lyrics-image.png"
                    alt="Taylor Swift"
                >
            </div>

            <div class="lyrics-content">

                <h2>Lyrics</h2>

                <div id="lyrics-list" class="lyrics-list">
                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="footer">
        <p>
            All images, artwork and related media are the property
            of Taylor Swift and their respective copyright holders.
            This is a non-commercial fan-made project.
        </p>
    </footer>


    <!-- JAVASCRIPT -->
    <script src="js/motif-detail.js"></script>

</body>
</html>
